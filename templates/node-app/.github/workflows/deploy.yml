name: Atlas CI + Deploy 🚀

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Setup Node
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '18'

      # - name: Install dependencies
      #   run: npm install

      # - name: Build TypeScript
      #   run: npx tsc

      # - name: Run App (test)
      #   run: |
      #     node dist/index.js &
      #     sleep 10

      # - name: Test App
      #   run: |
      #     curl --retry 5 --retry-delay 5 http://localhost:3000

      # 🚀 NEW PART (REAL DEVOPS)
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-southeast-2

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-southeast-2 \
          | docker login --username AWS --password-stdin 331608078139.dkr.ecr.ap-southeast-2.amazonaws.com

      - name: Set image tag
        run : echo "IMAGE_TAG=${{ github.sha}}" >> $GITHUB_ENV
      
      - name: Build Docker Image
        run: docker build -t atlas-app:$IMAGE_TAG .
      
      - name: Tag Image
        run: docker tag atlas-app:$IMAGE_TAG 331608078139.dkr.ecr.ap-southeast-2.amazonaws.com/atlas-app:$IMAGE_TAG

      - name: Push to ECR
        run: docker push 331608078139.dkr.ecr.ap-southeast-2.amazonaws.com/atlas-app:$IMAGE_TAG

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update ECS Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition atlas-task \
            --query taskDefinition > task-def.json

          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' task-def.json > clean-task-def.json

          jq '.containerDefinitions[0].image = "331608078139.dkr.ecr.ap-southeast-2.amazonaws.com/atlas-app:'"$IMAGE_TAG"'"' task-def.json > new-task-def.json

          aws ecs register-task-definition \
           --cli-input-json file://new-task-def.json
      
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
          --cluster atlas-cluster \
          --service atlas-service \
          --force-new-deployment