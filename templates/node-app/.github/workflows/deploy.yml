name: Atlas CI + Deploy 🚀

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Setup Node
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '18'

      # - name: Install dependencies
      #   run: npm install

      # - name: Build TypeScript
      #   run: npx tsc

      # - name: Run App (test)
      #   run: |
      #     node dist/index.js &
      #     sleep 10

      # - name: Test App
      #   run: |
      #     curl --retry 5 --retry-delay 5 http://localhost:3000

      # 🚀 NEW PART (REAL DEVOPS)
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::331608078139:role/github-actions-atlas-role
          aws-region: ap-southeast-2

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-southeast-2 \
          | docker login --username AWS --password-stdin 331608078139.dkr.ecr.ap-southeast-2.amazonaws.com

      - name: Set image tag
        run : echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
      
      - name: Build Docker Image
        run: docker build -t atlas-app:$IMAGE_TAG .
      
      - name: Tag Image
        run: docker tag atlas-app:${{ github.sha}} 331608078139.dkr.ecr.ap-southeast-2.amazonaws.com/atlas-app:${{ github.sha}}

      - name: Push to ECR
        run: docker push 331608078139.dkr.ecr.ap-southeast-2.amazonaws.com/atlas-app:${{ github.sha }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      
      - name: Get current task definition
        run: |
         aws ecs describe-task-definition \
           --task-definition atlas-task \
           --query taskDefinition > task-def.json
      
      - name: Clean task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-def.json > clean-task-def.json

      - name: Update image in task definition
        run: |
          jq '.containerDefinitions[0].image = "331608078139.dkr.ecr.ap-southeast-2.amazonaws.com/atlas-app:'"$IMAGE_TAG"'"' \
          clean-task-def.json > new-task-def.json

      - name: Register new task definition
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://new-task-def.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text
          )
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV
      
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
          --cluster atlas-cluster \
          --service atlas-service \
          --task-definition $TASK_DEF_ARN \
          --force-new-deployment