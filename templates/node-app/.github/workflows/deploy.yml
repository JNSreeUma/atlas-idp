name: Atlas CI + Deploy 🚀

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npx tsc

      - name: Run App (test)
        run: |
          node dist/index.js &
          sleep 5

      - name: Test App
        run: curl http://localhost:5000

      # 🚀 NEW PART (REAL DEVOPS)
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-southeast-2

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-southeast-2 \
          | docker login --username AWS --password-stdin 331608078139.dkr.ecr.ap-southeast-2.amazonaws.com

      - name: Build Docker Image
        run: docker build -t atlas-app .

      - name: Tag Image
        run: docker tag atlas-app:latest 331608078139.dkr.ecr.ap-southeast-2.amazonaws.com/atlas-app:latest

      - name: Push to ECR
        run: docker push 331608078139.dkr.ecr.ap-southeast-2.amazonaws.com/atlas-app:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
          --cluster atlas-cluster \
          --service atlas-service \
          --force-new-deployment