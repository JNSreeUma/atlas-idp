name: Preview Deployment

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run app (test)
        run: echo "🚀 Preview environment ready!"

      - name: Show Preview URL
        run: |
          echo Preview: https://pr-${{ github.event.number }}.atlas.dev